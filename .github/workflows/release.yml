name: Release

# Pushing a tag such as v0.1.1 packs the templates and publishes them to nuget.org.
# It signs in with nuget.org Trusted Publishing (no API key is stored): the nuget.org account needs a policy
# for this repository (DualBrain/Templates) and workflow file (release.yml), and the repository needs a variable
# named NUGET_USER holding the nuget.org profile name.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Pack
        run: dotnet pack -c Release -p:Version="${GITHUB_REF_NAME#v}" -o artifacts
      - name: Create each template and build it
        run: bash ./test-templates.sh artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg
      - name: Sign in to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
